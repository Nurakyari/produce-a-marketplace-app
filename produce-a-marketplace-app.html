<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produce a Marketplace App — Kyari Market</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8f5;color:#17221a}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:14px;padding:14px 5%;z-index:5}.logo{font-size:20px;font-weight:bold;color:#195b35}.search{flex:1;max-width:520px;padding:12px;border:1px solid #ddd;border-radius:12px}.nav button,.chip{border:0;background:#fff;padding:10px;border-radius:9px;cursor:pointer}.cart,.btn{background:#195b35!important;color:#fff!important}.hero{padding:65px 7%;background:linear-gradient(120deg,#e5f3e9,#faf5df)}.hero h1{font-size:clamp(40px,6vw,68px);max-width:750px;margin:8px 0}.hero p{font-size:18px;color:#59645b;max-width:700px}.btn{border:0;border-radius:9px;padding:13px 18px;font-weight:bold;cursor:pointer}.content,.page{padding:45px 6%;max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip.active{background:#195b35;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card,.order{background:#fff;border:1px solid #e2e6e2;border-radius:15px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.body{padding:15px}.body small{color:#28764a;font-weight:bold}.body p{font-size:13px;color:#68736b;height:38px;overflow:hidden}.row{display:flex;justify-content:space-between;align-items:center}.small{padding:9px 11px;font-size:12px}.order{padding:18px;margin:10px 0;display:flex;justify-content:space-between}.status{background:#fff1bf;padding:6px 10px;border-radius:15px;font-size:12px}.box{background:#fff;border-radius:15px;padding:25px;max-width:520px}.box input,.box select,.box textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #d8ded9;border-radius:9px;font:inherit}.box textarea{min-height:100px}.total{display:flex;justify-content:space-between;font-size:20px;padding:15px 0}footer{padding:25px 6%;border-top:1px solid #ddd;color:#667}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}.search{order:3;width:100%}}@media(max-width:550px){.grid{grid-template-columns:1fr}.top{display:block}.order{display:block}}
</style></head><body>
<header><div class="logo" onclick="home()">🛍️ Kyari Market</div><input id="search" class="search" placeholder="Search products..." oninput="render()"><div class="nav"><button onclick="home()">Shop</button><button onclick="orders()">📦 Orders</button><button onclick="listing()">＋ Sell</button><button class="cart" onclick="cart()">🛒 Cart (<span id="count">0</span>)</button></div></header><main id="app"></main><footer><b>Kyari Market</b> — Produce a Marketplace App • 3MTT Project by Muhammad Babayo Kyari</footer>
<script>
const seed=[["Samsung Galaxy A15",285000,"Phones","Reliable smartphone with large display and strong battery life.","https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80"],["Men's Native Kaftan",35000,"Fashion","Elegant native kaftan for occasions and everyday wear.","https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=800&q=80"],["Wireless Headphones",22000,"Electronics","Bluetooth headphones for music, study and calls.","https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"],["Premium Rice 25kg",48000,"Food","Quality long-grain rice for family meals.","https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=800&q=80"]].map((x,i)=>({id:i+1,t:x[0],p:x[1],c:x[2],d:x[3],i:x[4]}));
let products=JSON.parse(localStorage.products||"null")||seed,cartItems=JSON.parse(localStorage.cart||"[]"),myOrders=JSON.parse(localStorage.orders||"[]"),cat="All";const money=n=>"₦"+Number(n).toLocaleString("en-NG");
function save(){localStorage.products=JSON.stringify(products);localStorage.cart=JSON.stringify(cartItems);localStorage.orders=JSON.stringify(myOrders);count.textContent=cartItems.reduce((a,x)=>a+x.q,0)}
function home(){render()}function render(){let q=(search.value||"").toLowerCase(),cats=["All",...new Set(products.map(x=>x.c))],list=products.filter(x=>(cat=="All"||x.c==cat)&&(`${x.t} ${x.d} ${x.c}`).toLowerCase().includes(q));app.innerHTML=`<section class="hero"><small>WELCOME TO KYARI MARKET</small><h1>Buy and sell with confidence.</h1><p>Discover products from local sellers. Search, list products and place orders in one simple marketplace.</p><button class="btn" onclick="document.getElementById('products').scrollIntoView()">Explore products</button></section><section class="content" id="products"><div class="top"><div><small>MARKETPLACE</small><h2>Featured products</h2></div><div class="chips">${cats.map(x=>`<button class="chip ${cat==x?'active':''}" onclick="cat='${x}';render()">${x}</button>`).join("")}</div></div><div class="grid">${list.map(x=>`<article class="card"><img src="${x.i}" alt=""><div class="body"><small>${x.c}</small><h3>${x.t}</h3><p>${x.d}</p><div class="row"><b>${money(x.p)}</b><button class="btn small" onclick="add(${x.id})">Add to cart</button></div></div></article>`).join("")}</div></section>`;save()}
function add(id){let p=products.find(x=>x.id==id),x=cartItems.find(x=>x.id==id);x?x.q++:cartItems.push({...p,q:1});save();alert("Added to cart")}
function cart(){let total=cartItems.reduce((a,x)=>a+x.p*x.q,0);app.innerHTML=`<section class="page"><h1>Your Cart</h1>${cartItems.length?cartItems.map(x=>`<div class="order"><div><b>${x.t}</b><p>${money(x.p)} × ${x.q}</p></div><b>${money(x.p*x.q)}</b></div>`).join(""):"<p>Your cart is empty.</p>"}<div class="total"><span>Total</span><b>${money(total)}</b></div>${cartItems.length?'<button class="btn" onclick="checkout()">Place Order</button>':""}</section>`}
function checkout(){let address=prompt("Enter delivery address:");if(!address)return;myOrders.unshift({id:"ORD-"+Date.now().toString().slice(-7),date:new Date().toLocaleString(),items:cartItems.map(x=>x.t+" × "+x.q),total:cartItems.reduce((a,x)=>a+x.p*x.q,0),address,status:"Pending"});cartItems=[];save();orders();alert("Order placed successfully")}
function orders(){app.innerHTML=`<section class="page"><small>MY ACCOUNT</small><h1>Your Orders</h1>${myOrders.length?myOrders.map(o=>`<div class="order"><div><b>${o.id}</b><p>${o.date}</p><p>${o.items.join(", ")}</p><small>${o.address}</small></div><div><b>${money(o.total)}</b><p class="status">${o.status}</p></div></div>`).join(""):"<p>No orders yet. Start shopping.</p>"}</section>`}
function listing(){app.innerHTML=`<section class="page"><small>SELL ON KYARI MARKET</small><h1>Create a Product Listing</h1><div class="box"><input id="lt" placeholder="Product name"><input id="lp" type="number" placeholder="Price (₦)"><select id="lc"><option>Phones</option><option>Electronics</option><option>Fashion</option><option>Food</option><option>Home</option><option>Other</option></select><input id="li" placeholder="Image URL (optional)"><textarea id="ld" placeholder="Product description"></textarea><button class="btn" onclick="publish()">Publish Listing</button></div></section>`}
function publish(){if(!lt.value||!lp.value)return alert("Product name and price are required");products.unshift({id:Date.now(),t:lt.value,p:+lp.value,c:lc.value,d:ld.value,i:li.value||seed[0].i});save();home();alert("Listing published")}
render();
</script></body></html>
